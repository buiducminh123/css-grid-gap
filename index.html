<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-gap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Thuộc tính grid-gap</h1>

    <h2>Ví dụ 1: <code>grid-gap: 20px</code></h2>
    <div class="grid-container grid-1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: <code>grid-gap: 30px 10px</code></h2>
    <div class="grid-container grid-2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>

</html>
